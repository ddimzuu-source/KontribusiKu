<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar · KontribusiKu</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="auth" class="auth-body">
  <main class="auth-card">
    <div class="brand">
      <div class="brand-logo">KK</div>
      <div><strong>KontribusiKu</strong>
        <small>Academic Teamwork &amp; Contribution Management</small></div>
    </div>
    <h1>Daftar</h1>
    <p class="muted">Buat akun untuk mulai berkolaborasi.</p>
    <form class="form" data-form="register" novalidate>
      <div class="field">
        <label for="name">Nama lengkap</label>
        <input id="name" name="name" type="text" maxlength="100" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password (8–72 karakter)</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="password_confirm">Konfirmasi password</label>
        <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Daftar</button>
    </form>
    <p class="small muted" style="margin-top:14px">Sudah punya akun? <a href="login.html">Masuk</a></p>
  </main>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
