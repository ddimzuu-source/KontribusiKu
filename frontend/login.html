<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk · KontribusiKu</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="auth" class="auth-body">
  <main class="auth-card">
    <div class="brand">
      <div class="brand-logo">KK</div>
      <div><strong>KontribusiKu</strong>
        <small>Academic Teamwork &amp; Contribution Management</small></div>
    </div>
    <h1>Masuk</h1>
    <p class="muted">Lanjutkan ke proyek kelompokmu.</p>
    <form class="form" data-form="login" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Masuk</button>
    </form>
    <p class="small muted" style="margin-top:14px">Belum punya akun? <a href="register.html">Daftar</a></p>
    <p class="small muted">Mode demo: isi email dan password apa saja.</p>
  </main>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
